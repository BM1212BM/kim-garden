<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สวนของคิม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg: #f6f4ee; --card: #ffffff; --ink: #2b2a26; --muted: #7a776d; --line: #e6e2d6;
    --leaf: #3f9b6b; --leaf-2: #79c39a; --leaf-3: #b9e2c9; --soil: #c9b796; --sky: #eaf4ef;
    --trunk: #8a6a4a; --bloom: #e98aa8; --rest: #dfe6ee; --empty: #ece9e1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans Thai", system-ui, sans-serif; line-height: 1.6; }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 20px; font-weight: 700; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .stat b { display: block; font-size: 18px; font-weight: 700; }
  .stat span { font-size: 12px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 6px; margin: 0 0 12px; }
  .tab { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 4px; font: inherit; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
  .nsearch { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 14px; background: var(--bg); color: var(--ink); margin-bottom: 10px; }
  .ngrp { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .ngrp > summary { list-style: none; cursor: pointer; padding: 10px 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .ngrp > summary::-webkit-details-marker { display: none; }
  .ngrp > summary .cnt { color: var(--muted); font-weight: 400; font-size: 13px; }
  .nitem { padding: 10px 12px; border-top: 1px solid var(--line); }
  .nitem .nt { font-weight: 600; font-size: 14.5px; line-height: 1.45; }
  .nitem .ns { white-space: pre-line; font-size: 13.5px; line-height: 1.6; margin: 4px 0 0; color: var(--ink); }
  .nitem .nm { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .nitem .nm a { color: var(--leaf); text-decoration: none; overflow-wrap: anywhere; }
  .nitem .nm button { border: 0; background: none; padding: 0; font: inherit; color: var(--muted); cursor: pointer; text-decoration: underline; }
  .nitem .nm button.danger { color: #c0563f; }
  .tab[aria-selected="true"] { background: var(--leaf); border-color: var(--leaf); color: #fff; font-weight: 500; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; color: var(--muted); }
  .chip[aria-pressed="true"] { border-color: var(--leaf); color: var(--leaf); font-weight: 500; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .goal-list { list-style: none; padding: 0; margin: 10px 0 0; }
  .goal-list li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .goal-list li span:last-child { color: var(--muted); white-space: nowrap; }
  .state { text-align: center; padding: 48px 16px; color: var(--muted); }
  svg { display: block; width: 100%; height: auto; }
  [hidden] { display: none !important; }
  /* แท็บเป้าหมาย (v6: การ์ดพับได้ อ่านทีละเป้า) */
  .sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  .sum div { background: var(--bg); border-radius: 12px; padding: 10px 6px; text-align: center; }
  .sum b { display: block; font-size: 20px; line-height: 1.2; }
  .sum span { font-size: 12px; color: var(--muted); }
  .grp-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 2px 8px; }
  .grp-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .gc { border: 1px solid var(--line); border-left: 5px solid var(--rc, var(--line)); border-radius: 14px; margin-bottom: 10px; background: var(--card); overflow: hidden; }
  .gc > summary { list-style: none; cursor: pointer; padding: 12px 14px; }
  .gc > summary::-webkit-details-marker { display: none; }
  .gc-row { display: flex; align-items: flex-start; gap: 10px; }
  .gc-title { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; line-height: 1.4; }
  .gc-pct { flex: none; font-size: 15px; font-weight: 700; color: var(--rc); }
  .chev { flex: none; color: var(--muted); transition: transform .2s; font-size: 14px; margin-top: 2px; }
  .gc[open] .chev { transform: rotate(90deg); }
  .meter { height: 6px; background: var(--empty); border-radius: 99px; overflow: hidden; margin: 8px 0 6px; }
  .meter i { display: block; height: 100%; background: var(--rc, var(--leaf)); border-radius: 99px; }
  .gc-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
  .gc-next { margin-top: 8px; font-size: 14px; background: var(--bg); border-radius: 10px; padding: 7px 10px; }
  .gc-next b { color: var(--rc); font-weight: 700; margin-right: 4px; }
  .gc-body { padding: 0 14px 12px; border-top: 1px dashed var(--line); }
  .sub-h { font-size: 12px; font-weight: 700; color: var(--muted); margin: 12px 0 4px; letter-spacing: .02em; }
  .rt { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .rt:last-child { border-bottom: 0; }
  .rt-name { font-size: 14px; line-height: 1.4; }
  .rt-when { grid-column: 1; font-size: 12px; color: var(--muted); }
  .rt-count { grid-row: 1 / span 2; grid-column: 2; text-align: right; }
  .rt-count b { font-size: 15px; } .rt-count small { display: block; font-size: 11px; color: var(--muted); }
  .rt-count.ok b { color: var(--leaf); }
  .tasks { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  .tasks li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); line-height: 1.45; }
  .tasks li:last-child { border-bottom: 0; }
  .tasks .mk { flex: none; width: 18px; height: 18px; margin-top: 2px; border: 1.5px solid #c4bfb2; border-radius: 50%; }
  .tasks li.done { color: var(--muted); } .tasks li.done .t { text-decoration: line-through; }
  .tasks li.done .mk { background: var(--leaf); border-color: var(--leaf); }
  .tasks .t { flex: 1; min-width: 0; }
  .when { display: inline-block; font-size: 12px; border-radius: 6px; padding: 0 6px; margin-left: 2px; white-space: nowrap; }
  .when.due { background: #fdecd9; color: #9a5a17; } .when.late { background: #fbe1df; color: #b5483f; } .when.est { color: var(--muted); }
  .more { font-size: 13px; color: var(--leaf); cursor: pointer; padding: 6px 0 0; }
  .more summary { list-style: none; } .more .tasks { color: var(--ink); } .more summary::-webkit-details-marker { display: none; }
  .editable { cursor: pointer; }
  li.editable .ed { margin-left: auto; padding-left: 8px; font-size: 12.5px; color: var(--leaf); flex: 0 0 auto; }
  .sheet button.danger { color: #c0563f; }
  .gc-acts { display: flex; gap: 8px; margin: 12px 0 4px; }
  .gc-acts button { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 6px; font: inherit; font-size: 13.5px; color: var(--ink); cursor: pointer; }
  .gc-acts button:first-child { border-color: var(--leaf); color: var(--leaf); font-weight: 500; }
  .sheet .fl { display: block; font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .sheet .fl textarea, .sheet .fl select, .sheet .fl input { margin-left: 0; display: block; width: 100%; box-sizing: border-box; margin-top: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font: inherit; font-size: 15px; color: var(--ink); background: var(--card); }
  .sheet .seg, .sheet .days { display: flex; gap: 6px; margin: 0 0 12px; flex-wrap: wrap; }
  .sheet .seg button, .sheet .days button { flex: 1; width: auto; text-align: center; margin: 0; padding: 8px 6px; border-radius: 999px; font-size: 14px; }
  .sheet .days button { flex: 0 0 auto; min-width: 40px; }
  .sheet .seg button[aria-pressed="true"], .sheet .days button[aria-pressed="true"] { border-color: var(--leaf); background: #eef7f1; color: var(--leaf); font-weight: 500; }
  .sheet button.primary { background: var(--leaf); border-color: var(--leaf); color: #fff; text-align: center; font-weight: 500; }
  .sheet .rv { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; font-size: 14px; line-height: 1.5; }
  .sheet .rv input { margin-top: 3px; width: 18px; height: 18px; flex: 0 0 auto; accent-color: var(--leaf); }
  .sheet .rsum { font-size: 14px; color: var(--ink); line-height: 1.6; margin: 0 0 12px; }
  .hint { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 8px 10px; margin-top: 10px; }
  .r-main { --rc: #2f8a5c; } .r-secondary { --rc: #3a73a8; } .r-keep { --rc: #b4537a; } .r-project { --rc: #a87a2e; } .r-parked, .r-done { --rc: #a5a194; }
  .gc.r-parked .gc-title, .gc.r-done .gc-title { color: var(--muted); font-weight: 500; }
  .errs .tasks li { padding: 6px 0; }
  /* แท็บวันนี้ */
  .daypick { display: flex; gap: 6px; margin-bottom: 10px; }
  .daypick button { flex: 1; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 6px 4px; font: inherit; font-size: 13px; color: var(--muted); line-height: 1.3; }
  .daypick button b { display: block; font-size: 14px; color: var(--ink); }
  .daypick button[aria-pressed="true"] { border-color: var(--leaf); background: #eef7f1; }
  .daypick button[aria-pressed="true"] b { color: var(--leaf); }
  .notice { background: #eef7f1; border: 1px solid #cfe6d8; color: var(--ink); border-radius: 12px; padding: 10px 12px; margin: 0 0 10px; font-size: 13px; line-height: 1.55; }
  .notice button { display: block; margin-top: 8px; border: 0; background: var(--leaf); color: #fff; border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .energy { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .energy button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; color: var(--ink); cursor: pointer; }
  .energy button[aria-pressed="true"] { border-color: var(--leaf); background: #eef7f1; color: var(--leaf); font-weight: 500; }
  .dsum { font-size: 13px; color: var(--muted); margin: 2px 2px 6px; }
  .dbar { height: 6px; background: var(--empty); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .dbar i { display: block; height: 100%; background: var(--leaf); border-radius: 99px; transition: width .3s; }
  .trow { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .trow:last-child { border-bottom: 0; }
  .ttime { width: 40px; flex: none; font-size: 13px; color: var(--muted); padding-top: 3px; }
  .tchk { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #c4bfb2; background: var(--card); display: grid; place-items: center; font-size: 15px; color: #fff; padding: 0; cursor: pointer; }
  .tchk.on { background: var(--leaf); border-color: var(--leaf); }
  .tchk.skip { border-style: dashed; color: var(--muted); }
  .tchk:disabled { opacity: .5; }
  .tbody { flex: 1; min-width: 0; }
  .ttitle { font-size: 15px; font-weight: 500; line-height: 1.4; }
  .trow.done .ttitle { color: var(--muted); text-decoration: line-through; font-weight: 400; }
  .trow.none .ttitle { color: var(--muted); font-weight: 400; }
  .tmeta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tmeta .warn { color: #c0563f; font-weight: 500; }
  .tmore { flex: none; border: 0; background: none; font: inherit; font-size: 13px; color: var(--leaf); padding: 4px 2px; cursor: pointer; }
  .tgrp { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--tc); margin: 16px 0 0; }
  .tgrp i { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); }
  .tgrp .gadd, .gadd2 { margin-left: auto; border: 1px solid var(--tc, var(--leaf)); color: var(--tc, var(--leaf)); background: none; border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; }
  .grp-h .gadd2 { margin-left: 8px; }
  .trow { border-left: 3px solid var(--tc, transparent); padding-left: 9px; }
  .trow.partial .ttitle { color: var(--ink); }
  .tchk.half { background: #e9c46a; border-color: #e9c46a; color: #5b4a12; font-weight: 700; }
  .tmeta .part { color: #a06a00; }
  .tmin { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .tmin button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 9px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--ink); }
  .tmin button.ok { color: var(--leaf); border-color: var(--leaf); }
  .sheet .sh { font-weight: 600; color: var(--ink); margin: 16px 0 4px; font-size: 14.5px; }
  .sheet .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin: 8px 0 10px; }
  .sheet .frow { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; margin: 0; }
  .sheet .frow.wide { border-bottom: 1px solid var(--line); padding: 6px 0; }
  .sheet .frow span { display: flex; flex-direction: column; min-width: 0; }
  .sheet .frow small { color: var(--muted); font-size: 12px; }
  .sheet .frow select, .sheet .frow input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 14px; background: var(--card); color: var(--ink); }
  .sheet .fl input[type=time] { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font: inherit; font-size: 15px; background: var(--card); color: var(--ink); }
  .sheet .tres { background: #eef7f1; border-radius: 10px; padding: 10px; font-size: 13.5px; line-height: 1.5; }
  #app { position: relative; }
  .gear { position: absolute; top: 0; right: 0; border: 1px solid var(--line); background: var(--card); border-radius: 999px; width: 38px; height: 38px; font-size: 17px; cursor: pointer; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; z-index: 10; }
  .sheet { background: var(--card); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto; box-sizing: border-box; }
  .sheet input[type=text] { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; }
  .sheet h4 { margin: 0 0 4px; font-size: 15px; } .sheet p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .sheet button, .sheet label.btn { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 8px; font: inherit; font-size: 15px; color: var(--ink); cursor: pointer; }
  .sheet input[type=date] { font: inherit; font-size: 15px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; margin-left: 6px; }
  .sheet .fl input[type=date] { margin-left: 0; width: 100%; padding: 9px 10px; }
  .sheet .fl input[type=text] { font-size: 15px; padding: 9px 10px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2b2a26; color: #fff; font-size: 14px; padding: 10px 16px; border-radius: 12px; max-width: 90%; z-index: 20; }
  .section-h { font-size: 13px; font-weight: 500; color: var(--muted); margin: 18px 0 2px; }
  /* v24: ไทม์ไลน์วันนี้ · ภาพรวม · ปฏิทิน */
  .trow { border-left: 4px solid var(--tc, transparent); padding-left: 9px; border-radius: 0 10px 10px 0; background: color-mix(in srgb, var(--tc, #fff) 6%, var(--card)); margin: 6px 0; border-bottom: 0; }
  .trow .ttime:empty { width: 0; margin-right: -10px; }
  .trow.done { background: var(--card); opacity: .75; }
  .trow.running { background: #fff6dc; box-shadow: inset 0 0 0 1.5px #e9b949; }
  .tchip { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; background: var(--tc); border-radius: 6px; padding: 0 6px; margin-right: 6px; vertical-align: 1px; letter-spacing: .02em; }
  .badge { display: inline-block; font-size: 11px; border-radius: 6px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; white-space: nowrap; }
  .badge.pri { background: #fbe1df; color: #a33a30; font-weight: 700; }
  .badge.easy { background: #e6f4ea; color: #2c7a4b; } .badge.hard { background: #ece6f8; color: #5b3f9a; }
  .tplay { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; width: 30px; height: 30px; font-size: 12px; cursor: pointer; padding: 0; color: var(--ink); }
  .trow.running .tplay { background: #e9b949; border-color: #e9b949; color: #3d2f00; }
  .run { color: #8a6400; font-weight: 600; }
  .tsec { font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 14px 0 2px; display: flex; align-items: center; gap: 8px; }
  .tsec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .tsec .gadd { order: 2; margin-left: 0; border: 1px solid var(--leaf); color: var(--leaf); background: none; border-radius: 999px; padding: 1px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .tsec::after { order: 1; }
  .tdone > summary { list-style: none; cursor: pointer; font-size: 13px; color: var(--muted); padding: 10px 0 4px; }
  .tdone > summary::-webkit-details-marker { display: none; }
  .restbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--rest); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; margin: 0 0 10px; }
  .restbar button, .linkbtn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); white-space: nowrap; }
  .linkbtn { border: 0; background: none; color: var(--leaf); padding: 0; text-decoration: underline; font-size: 12.5px; }
  .ehint { font-size: 12px; color: var(--muted); margin: -6px 0 10px; }
  .ov-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .ov-top select { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font: inherit; background: var(--card); color: var(--ink); }
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  .kpi { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .kpi .vs { display: block; font-style: normal; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .kpi b { display: block; font-size: 22px; line-height: 1.2; } .kpi span { font-size: 12px; color: var(--muted); }
  .ov-h { font-size: 14px; font-weight: 700; margin: 18px 0 6px; }
  .hbar { display: grid; grid-template-columns: minmax(0, 1fr) 2fr auto; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
  .hbar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .tr { height: 10px; background: var(--empty); border-radius: 99px; overflow: hidden; }
  .hbar .tr i { display: block; height: 100%; background: var(--leaf); border-radius: 0 4px 4px 0; }
  .hbar .v { color: var(--muted); font-variant-numeric: tabular-nums; }
  .calnav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 6px; }
  .calnav button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; width: 34px; height: 30px; font: inherit; cursor: pointer; }
  .calnav button:disabled { opacity: .35; }
  .calg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .calg .dh { text-align: center; font-size: 11px; color: var(--muted); padding: 2px 0; }
  .calg button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; min-height: 46px; padding: 3px 2px; font: inherit; font-size: 12px; line-height: 1.25; cursor: pointer; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .calg button b { font-size: 13px; }
  .calg button small { font-size: 10.5px; color: var(--muted); }
  .calg button.free { background: #e6f4ea; } .calg button.some { background: #fff6dc; } .calg button.full { background: #fbe1df; } .calg button.rest { background: var(--rest); }
  .calg button.past { opacity: .35; } .calg button[aria-pressed="true"] { outline: 2px solid var(--ink); }
  .calg .pad { min-height: 46px; }
  .daydet { background: var(--bg); border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 13.5px; }
  .daydet ul { margin: 6px 0 0; padding-left: 18px; }
  .fac { font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line); }
  .about textarea { min-height: 52px; }
  .nact { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .nact button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--ink); }
  .nact button.go { border-color: var(--leaf); color: var(--leaf); }
  .tchip.plain { background: var(--bg); color: var(--ink); border: 1px solid var(--line); font-weight: 600; }
  .glegend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  .glegend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .tnote { font-size: 12.5px; color: var(--muted); margin-top: 3px; white-space: pre-line; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tbody[data-row] { cursor: pointer; }
  .ord { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-left: 4px solid var(--tc); border-radius: 0 10px 10px 0; padding: 8px 8px 8px 10px; margin: 6px 0; background: var(--card); }
  .ord .ot { flex: 1; min-width: 0; font-size: 14px; }
  .ord .ot small { display: block; color: var(--muted); font-size: 12px; }
  .ord button { flex: none; width: 36px; height: 34px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; font: inherit; cursor: pointer; color: var(--ink); }
  .ord button:disabled { opacity: .3; }
  .ordbar { display: flex; gap: 8px; margin: 10px 0; } .ordbar button { flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 11px; font: inherit; font-size: 14px; cursor: pointer; } .ordbar button.primary { background: var(--leaf); border-color: var(--leaf); color: #fff; font-weight: 600; }
  .nadd { width: 100%; margin: 0 0 10px; border: 1px dashed var(--leaf); color: var(--leaf); background: none; border-radius: 12px; padding: 9px; font: inherit; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div id="state" class="state">กำลังเปิดสวน…</div>
  <div id="app" hidden>
    <button class="gear" id="gear" aria-label="ตั้งค่า">⚙️</button>
    <h1 id="title">สวนของเธอ</h1>
    <p class="sub" id="today"></p>
    <div class="stats">
      <div class="stat"><b id="s-jar">0</b><span>ชม. เดือนนี้</span></div>
      <div class="stat"><b id="s-month">0/0</b><span>วันที่ได้ทำ</span></div>
      <div class="stat"><b id="s-total">0</b><span>วันทั้งหมด</span></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="today" aria-selected="true">วันนี้</button>
      <button class="tab" role="tab" data-tab="goals" aria-selected="false">เป้าหมาย</button>
      <button class="tab" role="tab" data-tab="overview" aria-selected="false">ภาพรวม</button>
      <button class="tab" role="tab" data-tab="notes" aria-selected="false">โน้ต</button>
    </div>
    <section class="card" data-panel="today" hidden>
      <div class="daypick" id="daypick"></div>
      <div id="dayview"><p class="note">กำลังโหลดแผน…</p></div>
    </section>
    <section class="card" data-panel="goals" hidden>
      <div class="sum" id="goal-sum"></div>
      <div id="goal-cards"></div>
      <p class="note"><span class="when due">ส่ง 19 พ.ย.</span> กำหนดส่งจริง · <span class="when est">≈ พ 4 พ.ย.</span> วันที่คิมจัดให้ทำ (ตามเวลาว่าง)</p>
    </section>
    <section class="card" data-panel="notes" hidden>
      <button class="nadd" id="note-add">+ เขียนโน้ตเอง</button>
      <input id="note-q" class="nsearch" type="search" placeholder="ค้นโน้ต…" aria-label="ค้นโน้ต">
      <div id="note-list"></div>
      <p class="note">เขียนเองได้ด้วยปุ่มด้านบน · หรือพิมพ์ "จดโน้ต …" ในแชท ส่งลิงก์ หรือส่งรูป คิมสรุปและจัดหมวดให้</p>
    </section>
    <section class="card" data-panel="overview" hidden>
      <div id="ov"><p class="note">กำลังโหลด…</p></div>
    </section>
  </div>
</main>
<script>
// ===== ตั้งค่า =====
// LIFF ID ไม่ต้องใส่แล้ว: หน้าสวนถามจาก garden-data เอง (ใช้ Secret LIFF_ID ใน Supabase) · ใส่ตรงนี้ก็ได้ถ้าอยากบังคับ
let LIFF_ID = "";
const FUNCTION_URL = "https://wprtvubpruzugrivbovf.supabase.co/functions/v1/garden-data";
const VERSION = "v27";
// =====================================

const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const C = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const short = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);

function plant(g, x, ground, stage, opts = {}) {
  const grp = el("g", { opacity: opts.faded ? 0.4 : 1 }, g);
  const leaf = C("--leaf"), leaf2 = C("--leaf-2"), trunk = C("--trunk");
  if (stage === 0) { el("ellipse", { cx: x, cy: ground - 4, rx: 7, ry: 5, fill: C("--trunk") }, grp); return; }
  const h = [0, 22, 42, 52, 90, 96][stage];
  el("line", { x1: x, y1: ground, x2: x, y2: ground - h, stroke: stage >= 4 ? trunk : leaf, "stroke-width": stage >= 4 ? 7 : 3, "stroke-linecap": "round" }, grp);
  if (stage <= 2) {
    const pairs = stage === 1 ? 1 : 2;
    for (let i = 0; i < pairs; i++) {
      const y = ground - h + 6 + i * 16;
      el("ellipse", { cx: x - 9, cy: y, rx: 9, ry: 4.5, fill: leaf2, transform: `rotate(-25 ${x - 9} ${y})` }, grp);
      el("ellipse", { cx: x + 9, cy: y - 4, rx: 9, ry: 4.5, fill: leaf, transform: `rotate(25 ${x + 9} ${y - 4})` }, grp);
    }
    return;
  }
  const top = ground - h, r = stage === 3 ? 24 : 34;
  [[0, 0, r], [-r * 0.6, 8, r * 0.7], [r * 0.6, 8, r * 0.7]].forEach(([dx, dy, rr], i) =>
    el("circle", { cx: x + dx, cy: top + dy, r: rr, fill: i ? leaf2 : leaf }, grp));
  if (stage === 5) {
    [[-14, -10], [10, -18], [18, 6], [-20, 10], [0, 4], [6, -30], [-6, 18]].forEach(([dx, dy]) =>
      el("circle", { cx: x + dx, cy: top + dy, r: 4, fill: C("--bloom") }, grp));
  }
}

// ตัดชื่อเป็น 2 บรรทัดตามคำ (ภาษาไทยไม่มีเว้นวรรค ใช้ Intl.Segmenter ถ้ามี)
function twoLines(text, max) {
  const words = (() => { try { return [...new Intl.Segmenter("th", { granularity: "word" }).segment(text)].map((x) => x.segment); } catch { return text.split(/(\s+)/); } })();
  const lines = ["", ""]; let i = 0;
  for (const w of words) {
    if ((lines[i] + w).length > max) { if (i === 1 || !lines[i]) { lines[i] = short(lines[i] + w, max); if (i === 1) break; i++; continue; } i++; }
    if (i > 1) break;
    lines[i] += i && !lines[i] ? w.trimStart() : w;
  }
  if (words.join("").length > (lines[0] + lines[1]).length && !lines[1].endsWith("…")) lines[1] = short(lines[1] + "…", max);
  return lines.filter((l) => l.trim());
}

function drawGarden(goals) {
  const svg = document.getElementById("garden");
  if (!svg) return;
  svg.innerHTML = "";
  const shown = goals.filter((g) => g.status !== "done").concat(goals.filter((g) => g.status === "done"));
  const perRow = shown.length <= 4 ? Math.max(shown.length, 1) : shown.length <= 8 ? Math.ceil(shown.length / 2) : 4;
  const rows = Math.max(1, Math.ceil(shown.length / perRow));
  const rowH = 190, H = rows * rowH + 10;
  svg.setAttribute("viewBox", `0 0 360 ${H}`);
  el("rect", { x: 0, y: 0, width: 360, height: H, rx: 12, fill: C("--sky") }, svg);
  if (!shown.length) {
    const t = el("text", { x: 180, y: 100, "text-anchor": "middle", "font-size": 14, fill: C("--muted") }, svg);
    t.textContent = "ยังไม่มีต้นไม้ ตั้งเป้าแรกกับคิมได้เลย";
  }
  for (let r = 0; r < rows; r++) {
    const ground = r * rowH + 135;
    el("rect", { x: 0, y: ground - 2, width: 360, height: 56, fill: C("--soil"), opacity: 0.55 }, svg);
    const list = shown.slice(r * perRow, r * perRow + perRow);
    list.forEach((g, i) => {
      const x = (360 / (list.length + 1)) * (i + 1);
      plant(svg, x, ground, g.stage, { faded: g.status === "paused" });
      twoLines(g.title, list.length >= 4 ? 9 : 12).forEach((line, k) => {
        const t = el("text", { x, y: ground + 18 + k * 15, "text-anchor": "middle", "font-size": 12, fill: g.status === "paused" ? C("--muted") : C("--ink") }, svg);
        t.textContent = line;
      });
    });
  }
  document.getElementById("goal-list").innerHTML = goals.map((g) => {
    const tag = g.status === "done" ? L("สำเร็จแล้ว 🌸", "Achieved 🌸") : g.status === "paused" ? L("เก็บไว้ก่อน", "Parked") : L(({ main: "เป้าหลัก", secondary: "เป้ารอง", keep: "ดูแลชีวิต", project: "โปรเจกต์" })[g.priority] ?? "เป้ารอง", ({ main: "Main goal", secondary: "Secondary", keep: "Life care", project: "Project" })[g.priority] ?? "Secondary");
    return `<li><span>${escapeHtml(g.title)}</span><span>${tag} · ${g.kept} ${L("วัน", "days")}</span></li>`;
  }).join("");
}

function drawBranch(goal) {
  const svg = document.getElementById("branch");
  svg.innerHTML = "";
  const routines = goal.tasks.filter((x) => x.status === "routine");
  const tasks = goal.tasks.filter((x) => x.status !== "routine");
  const perBranch = 5, branches = Math.max(1, Math.ceil(tasks.length / perBranch));
  const shownBranches = Math.min(branches, 8);
  const top = 30, bottom = 300, step = (bottom - top - 30) / shownBranches;
  el("line", { x1: 180, y1: bottom, x2: 180, y2: top, stroke: C("--trunk"), "stroke-width": 9, "stroke-linecap": "round" }, svg);
  for (let b = 0; b < shownBranches; b++) {
    const y = bottom - 30 - b * step, dir = b % 2 ? -1 : 1, ex = 180 + dir * 120;
    el("path", { d: `M180 ${y} Q ${180 + dir * 50} ${y - 10} ${ex} ${y - 26}`, stroke: C("--trunk"), "stroke-width": 4, fill: "none", "stroke-linecap": "round" }, svg);
    tasks.slice(b * perBranch, b * perBranch + perBranch).forEach((t, i) => {
      const lx = 180 + dir * (34 + i * 21), ly = y - 6 - i * 4.4 - (i % 2 ? 10 : -6);
      el("ellipse", {
        cx: lx, cy: ly, rx: 9, ry: 5.5, transform: `rotate(${dir * -30} ${lx} ${ly})`,
        fill: t.status === "done" ? C("--leaf") : "#fff", stroke: t.status === "done" ? C("--leaf") : "#b8b3a6", "stroke-width": 1.5,
      }, svg);
    });
  }
  const t = el("text", { x: 180, y: 18, "text-anchor": "middle", "font-size": 13, "font-weight": 500, fill: C("--ink") }, svg);
  t.textContent = short(goal.title, 30);
  const done = tasks.filter((x) => x.status === "done").length;
  const rLine = routines.length ? `กิจวัตร: ${routines.map((x) => x.title).join(" · ")}` : "";
  document.getElementById("branch-note").textContent = [tasks.length
    ? `ทำเสร็จ ${done} จาก ${tasks.length} งาน${branches > shownBranches ? ` (แสดง ${shownBranches * perBranch} งานแรก)` : ""}`
    : routines.length ? "" : "ยังไม่มีงานในเป้านี้", rLine].filter(Boolean).join(" · ");
}

function drawStreak(days, today) {
  const svg = document.getElementById("streak");
  svg.innerHTML = "";
  const map = new Map();
  for (const d of days) {
    const prev = map.get(d.day);
    if (!prev || (d.minutes ?? 0) > (prev.minutes ?? 0) || (d.result && !prev.result)) map.set(d.day, d);
  }
  const t = new Date(today + "T00:00:00Z");
  const start = new Date(t); start.setUTCDate(t.getUTCDate() - t.getUTCDay() - 7 * 11);
  const cell = 20, gap = 6, left = 30, topY = 18;
  DAY.forEach((n, r) => {
    if (r % 2) return;
    const tx = el("text", { x: 2, y: topY + r * (cell + gap) + 14, "font-size": 10, fill: C("--muted") }, svg);
    tx.textContent = n;
  });
  for (let w = 0; w < 12; w++) {
    for (let r = 0; r < 7; r++) {
      const d = new Date(start); d.setUTCDate(start.getUTCDate() + w * 7 + r);
      const key = d.toISOString().slice(0, 10);
      if (key > today) continue;
      const info = map.get(key);
      let fill = C("--empty");
      if (info?.rest) fill = C("--rest");
      else if (["full", "small", "partial"].includes(info?.result)) fill = info.minutes >= 30 ? C("--leaf") : info.minutes >= 15 ? C("--leaf-2") : C("--leaf-3");
      const rect = el("rect", { x: left + w * (cell + gap), y: topY + r * (cell + gap), width: cell, height: cell, rx: 4, fill }, svg);
      if (key === today) { rect.setAttribute("stroke", C("--ink")); rect.setAttribute("stroke-width", 1.5); }
      const tip = el("title", {}, rect); tip.textContent = `${key}${info?.minutes ? ` · ${fmtM(info.minutes) || info.minutes}` : ""}`;
      if (r === 0 && d.getUTCDate() <= 7) {
        const m = el("text", { x: left + w * (cell + gap), y: 10, "font-size": 10, fill: C("--muted") }, svg);
        m.textContent = MONTH[d.getUTCMonth()];
      }
    }
  }
}

const ROLE = { main: "เป้าหลัก", secondary: "เป้ารอง", keep: "ดูแลชีวิต", project: "โปรเจกต์" };
const DAY = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
const MONTH = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
const thDate = (d) => `${Number(d.slice(8, 10))} ${MONTH[Number(d.slice(5, 7)) - 1]}`;
const freq = (t) => t.days?.length ? (t.days.length === 7 ? (LANG === "en" ? "every day" : "ทุกวัน") : t.days.map((d) => DAY[d]).join(" ")) : LANG === "en" ? `${t.per_week ?? 1}×/week` : `สัปดาห์ละ ${t.per_week ?? 1}`;
const mins = (m) => (m > 5 ? ` · ${fmtM(m)}` : "");

const roleKey = (g) => g.status === "done" ? "done" : g.status === "paused" ? "parked" : (ROLE[g.priority] ? g.priority : "secondary");
const roleName = (g) => g.status === "done" ? "สำเร็จแล้ว" : g.status === "paused" ? "เก็บไว้ก่อน" : ROLE[g.priority] ?? "เป้ารอง";
const whenTag = (t, today) => t.status === "done" ? (t.done_on ? ` <span class="when est">✓ ${t.done_on === today ? "วันนี้" : `${DAY[new Date(t.done_on + "T00:00:00Z").getUTCDay()]} ${thDate(t.done_on)}`}</span>` : "")
  : t.fixed ? ` <span class="when due">📌 ${t.fixed.day === today ? "วันนี้" : `${DAY[new Date(t.fixed.day + "T00:00:00Z").getUTCDay()]} ${thDate(t.fixed.day)}`} ${t.fixed.at}${t.minutes > 5 ? `–${(() => { const m = Number(t.fixed.at.slice(0, 2)) * 60 + Number(t.fixed.at.slice(3)) + t.minutes; return `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; })()}` : ""}</span>`
  : (t.est ? ` <span class="when est">≈ ${t.est === today ? "วันนี้" : `${DAY[new Date(t.est + "T00:00:00Z").getUTCDay()]} ${thDate(t.est)}`}</span>` : "")
  + (t.due ? ` <span class="when ${t.due < today ? "late" : "due"}">${t.due < today ? "เลยกำหนด" : "ส่ง"} ${thDate(t.due)}</span>` : "");
const taskLi = (t, today) => `<li class="${t.status === "done" ? "done" : ""}${t.id && t.status === "todo" ? " editable" : ""}"${t.id && t.status === "todo" ? ` data-edit="${t.id}"` : ""}><span class="mk"></span><span class="t">${escapeHtml(t.title.replace(/^🧳 /, "🧳 "))}${t.status === "todo" ? badges(t) : ""}${t.note ? " 📝" : ""}${whenTag(t, today)}</span>${t.id && t.status === "todo" ? '<span class="ed">แก้</span>' : ""}</li>`;

function goalCard(g, today, open) {
  const rk = roleKey(g);
  const steps = g.tasks.filter((t) => t.status !== "routine");
  const routines = g.tasks.filter((t) => t.status === "routine");
  const done = steps.filter((t) => t.status === "done").length;
  const tkey = (t) => t.fixed?.day || t.locked || t.est || t.due || "9999";
  const todo = steps.filter((t) => t.status !== "done").sort((a, b) => tkey(a).localeCompare(tkey(b)) || (a.pri ?? 2) - (b.pri ?? 2));   // เรียงตามวันที่จะทำ/กำหนดส่ง
  const rDone = routines.reduce((s, t) => s + Math.min(t.weekDone, Math.min(t.weekTarget, 7)), 0);
  const rTarget = routines.reduce((s, t) => s + Math.min(t.weekTarget, 7), 0);
  // ความคืบหน้า (สะสม ไม่เริ่มใหม่): เป้าที่มีงานทีละขั้น = งานที่เสร็จทั้งหมด / งานทั้งหมด · เป้าที่มีแต่กิจวัตร = ทำครบกี่ครั้งใน 7 วันล่าสุด
  const pct = g.status === "paused" ? null : steps.length ? Math.round((done / steps.length) * 100) : rTarget ? Math.round((rDone / rTarget) * 100) : null;
  const pctLabel = steps.length ? `งานเสร็จ ${done}/${steps.length}` : "กิจวัตร 7 วันล่าสุด";
  const left = g.deadline ? Math.round((Date.parse(g.deadline) - Date.parse(today)) / 864e5) : null;
  const meta = [
    g.status !== "active" ? `<span>${roleName(g)}</span>` : "",
    g.deadline ? `<span>🎯 ${thDate(g.deadline)} ${Number(g.deadline.slice(0, 4)) + (LANG === "en" ? 0 : 543)}${left >= 0 ? L(` · อีก ${left} วัน`, ` · ${left} days left`) : L(" · เลยกำหนด", " · overdue")}</span>` : "",
    steps.length ? `<span>งาน ${done}/${steps.length}</span>` : "",
    rTarget ? `<span>กิจวัตร 7 วัน ${rDone}/${rTarget}</span>` : "",
    `<span>🌱 ${g.kept} วัน</span>`,
  ].filter(Boolean).join("");
  const next = todo[0];
  const nextHtml = next && g.status !== "done" ? `<div class="gc-next"><b>ถัดไป</b>${escapeHtml(next.title)}${whenTag(next, today)}</div>` : "";
  const rtHtml = routines.map((t) => {
    const n = Math.min(t.weekTarget, 7), k = Math.min(t.weekDone, n);
    return `<div class="rt${t.id ? " editable" : ""}"${t.id ? ` data-edit="${t.id}"` : ""}><span class="rt-name">${escapeHtml(t.title)}</span><span class="rt-when">${freq(t)}${mins(t.minutes)}</span><span class="rt-count ${k >= n ? "ok" : ""}"><b>${k}/${n}</b><small>7 วันล่าสุด</small></span></div>`;
  }).join("");
  const SHOW = 5, doneList = steps.filter((t) => t.status === "done");
  const stepHtml = todo.length || doneList.length ? `
    <p class="sub-h">งานทีละขั้น · เหลือ ${todo.length}</p>
    <ul class="tasks">${todo.slice(0, SHOW).map((t) => taskLi(t, today)).join("")}</ul>
    ${todo.length > SHOW ? `<details class="more"><summary>+ อีก ${todo.length - SHOW} งาน</summary><ul class="tasks">${todo.slice(SHOW).map((t) => taskLi(t, today)).join("")}</ul></details>` : ""}
    ${doneList.length ? `<details class="more"><summary>✓ เสร็จแล้ว ${doneList.length} งาน</summary><ul class="tasks">${doneList.map((t) => taskLi(t, today)).join("")}</ul></details>` : ""}` : "";
  const hint = g.status === "paused" && todo.length ? '<p class="hint">เป้านี้เก็บไว้ก่อน คิมยังไม่จัดลงวัน (ยกเว้นงานที่มีกำหนดส่ง) · อยากเริ่ม พิมพ์ในแชทคิม เช่น "ย้ายเรื่องนี้เป็นโปรเจกต์"</p>' : "";
  const acts = g.status === "active" || g.status === "paused" ? `<div class="gc-acts"><button data-addtask="${g.id}">+ เพิ่มงาน</button><button data-review="${g.id}">🔍 ให้คิมช่วยดู</button></div>` : "";
  return `<details class="gc r-${rk}" data-gid="${g.id}"${open ? " open" : ""}>
    <summary>
      <div class="gc-row"><span class="gc-title">${escapeHtml(g.title)}</span>${pct !== null && g.status !== "done" ? `<span class="gc-pct">${pct}%</span>` : g.status === "done" ? '<span class="gc-pct">🌸</span>' : ""}<span class="chev">▶</span></div>
      ${pct !== null && g.status === "active" ? `<div class="meter" role="img" aria-label="${pctLabel} ${pct}%" title="${pctLabel}"><i style="width:${pct}%"></i></div>` : '<div style="height:6px"></div>'}
      <div class="gc-meta">${meta}</div>
      ${open ? "" : nextHtml}
    </summary>

      ${stepHtml}

}

function drawGoals(data) {
  const active = data.goals.filter((g) => g.status === "active");
  const others = data.goals.filter((g) => g.status !== "active");
  const steps = active.flatMap((g) => g.tasks.filter((t) => t.status !== "routine"));
  const routines = active.flatMap((g) => g.tasks.filter((t) => t.status === "routine"));
  const rDone = routines.reduce((s, t) => s + Math.min(t.weekDone, Math.min(t.weekTarget, 7)), 0);
  const rTarget = routines.reduce((s, t) => s + Math.min(t.weekTarget, 7), 0);
  const stepsDone = steps.filter((t) => t.status === "done").length;
  document.getElementById("goal-sum").innerHTML = `
    <div><b>${active.length}</b><span>เป้าที่กำลังทำ</span></div>
    <div><b>${stepsDone}/${steps.length}</b><span>งานเสร็จ</span></div>
    <div><b>${rTarget ? `${Math.round((rDone / rTarget) * 100)}%` : "–"}</b><span>กิจวัตร 7 วัน</span></div>`;
  const order = ["main", "secondary", "project", "keep"];
  const prev = [...document.querySelectorAll("#goal-cards details.gc")];   // วาดใหม่แล้วการ์ดที่เปิดอยู่ยังเปิด ไม่เด้ง
  const openIds = new Set(prev.filter((d) => d.open).map((d) => d.dataset.gid));
  const moreOpen = new Set([...document.querySelectorAll("#goal-cards details.gc details.more[open]")].map((d) => `${d.closest(".gc").dataset.gid}|${d.querySelector("summary").textContent.slice(0, 2)}`));
  const groups = order.map((r) => [r, active.filter((g) => roleKey(g) === r)]).filter(([, l]) => l.length);
  let first = true;
  const goalsHtml = groups.map(([r, list]) => `<p class="grp-h">${ROLE[r]}${list.length > 1 ? ` · ${list.length}` : ""}</p>${list.map((g) => { const o = prev.length ? openIds.has(String(g.id)) : first; first = false; return goalCard(g, data.today, o); }).join("")}`).join("");
  const err = data.errands ?? { todo: [], done: 0 };
  const errHtml = true ? `<p class="grp-h">📌 งานทั่วไป · ค้าง ${err.todo.length}${err.done ? ` · เคลียร์แล้ว ${err.done}` : ""}<button class="gadd2" data-adderr="1">+ เพิ่ม</button></p>
    <div class="gc errs" style="padding:4px 14px"><ul class="tasks">${err.todo.map((e) => taskLi({ ...e, status: "todo" }, data.today)).join("") || '<li><span class="t" style="color:var(--muted)">เคลียร์หมดแล้ว 🎉</span></li>'}</ul></div>` : "";
  const otherHtml = others.length ? `<p class="grp-h">เก็บไว้ก่อน / สำเร็จแล้ว · ${others.length}</p>${others.map((g) => goalCard(g, data.today, openIds.has(String(g.id)))).join("")}` : "";
  document.getElementById("goal-cards").innerHTML =
    (active.length ? goalsHtml : '<p class="hint">ยังไม่มีเป้าที่กำลังทำ พิมพ์ "แผนชีวิต" ในแชทคิมได้เลย</p>') + errHtml + otherHtml;
  document.querySelectorAll("#goal-cards details.gc details.more").forEach((d) => { if (moreOpen.has(`${d.closest(".gc").dataset.gid}|${d.querySelector("summary").textContent.slice(0, 2)}`)) d.open = true; });
}

function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

function render(data, name) {
  document.getElementById("state").hidden = true;
  document.getElementById("app").hidden = false;
  if (name) document.getElementById("title").textContent = LANG === "en" ? `${name}'s Kim` : `สวนของ${name}`;
  const [y, m, d] = data.today.split("-");
  document.getElementById("today").textContent = LANG === "en" ? `As of ${Number(d)} ${MONTH[Number(m) - 1]} ${y} · ${VERSION}` : `ข้อมูล ณ ${Number(d)}/${Number(m)}/${Number(y) + 543} · ${VERSION}`;
  document.getElementById("s-jar").textContent = (data.stats.jarMonth / 60).toFixed(1);
  document.getElementById("s-month").textContent = `${data.stats.keptMonth}/${data.stats.promisedMonth}`;
  document.getElementById("s-total").textContent = data.stats.keptTotal;
  GDATA = data;
  (data.goals || []).forEach((g, i) => { if (g.id == null) g.id = -(i + 1); if (DEMO) g.tasks.forEach((t, j) => { if (t.id == null) t.id = -(i * 100 + j + 1); }); });   // หน้าตัวอย่าง
  drawGarden(data.goals);
  drawGoals(data);
  NOTES = data.notes || []; GOAL_ORDER = (data.goals || []).map((g) => g.title);
  drawNotes();
  translateTree(document.getElementById("app"));
}

// ===== แท็บโน้ต: จัดกลุ่มตามหมวด (หมวดที่เป็นเป้ามาก่อน) ค้นได้ ลบ/ย้ายหมวดได้ =====

async function goalAct(data) {
  if (DEMO) {
    await new Promise((r) => setTimeout(r, 400));
    if (data.startsWith("a=goal_review")) return { ok: true, data: { goal: "ตัวอย่าง", summary: "งานส่วนใหญ่ชัดดี แต่ทำสไลด์ใช้เวลาน้อยไป และยังไม่มีขั้นซ้อมก่อนพรีเซนต์", ops: [
      { op: "minutes", task_id: 1, minutes: 90, label: '⏱ "ทำสไลด์" 30 → 90 นาที — สไลด์ 10 หน้ามักใช้เวลาเกินชั่วโมง' },
      { op: "add", title: "ซ้อมพรีเซนต์ 1 รอบ", minutes: 30, due: null, label: '➕ เพิ่ม "ซ้อมพรีเซนต์ 1 รอบ" (30 นาที) — กันตื่นเต้นวันจริง' } ] } };
    return { ok: true, note: "(ตัวอย่าง) " + decodeURIComponent(data).slice(0, 80) };
  }
  const r = await fetch(FUNCTION_URL, { method: "POST", headers: { "x-line-id-token": ID_TOKEN, "content-type": "application/json" }, body: JSON.stringify({ data }) });
  if (r.status === 401 && relogin()) return null;
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
async function reloadGarden() {
  if (DEMO) return;
  try {
    const r = await fetch(FUNCTION_URL, { headers: { "x-line-id-token": ID_TOKEN } });
    if (r.status === 401 && relogin()) return;
    const y = window.scrollY;
    if (r.ok) { render(await r.json(), NAME); window.scrollTo(0, y); }
    DAYS = null; OV = null;
  } catch (_) {}
}
function openSheet(html) {
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet">${html}</div>`;

}
function findTask(id) {
  for (const g of GDATA?.goals || []) { const t = g.tasks.find((x) => String(x.id) === String(id)); if (t) return { g, t }; }
  const e = (GDATA?.errands?.todo || []).find((x) => String(x.id) === String(id)) || (DAYS?.days?.[0]?.errands || []).find((x) => String(x.id) === String(id));
  return e ? { g: null, t: { ...e, errand: true } } : null;
}
function errandSheet(t) {
  const reps = [[0, "ไม่ซ้ำ"], [7, "ทุกสัปดาห์"], [14, "ทุก 2 สัปดาห์"], [30, "ทุกเดือน"], [90, "ทุก 3 เดือน"], [365, "ทุกปี"]];
  if (t.repeat && !reps.some(([d]) => d === t.repeat)) reps.push([t.repeat, `ทุก ${t.repeat} วัน`]);
  const today = GDATA?.today || DAYS?.today || "";
  const bg = openSheet(`<h4>แก้งานทั่วไป</h4>
    <label class="fl">ชื่อ<input type="text" name="title" maxlength="120" value="${escapeHtml(t.title)}"></label>
    <label class="fl">ต้องทำวันไหน (ไม่ใส่ = ไม่มีกำหนด)<input type="date" name="due" value="${t.due || ""}" min="${today}"></label>
    <label class="fl">ทำซ้ำ<select name="rep">${reps.map(([d, l]) => `<option value="${d}" ${(t.repeat || 0) === d ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    <label class="fl">📝 โน้ต / รายละเอียด<textarea name="note" rows="4" maxlength="4000" placeholder="รายละเอียด ของที่ต้องเตรียม ลิงก์ ฯลฯ">${escapeHtml(t.note || "")}</textarea></label>
    <button class="primary" data-save>บันทึก</button>
    <button class="danger" data-del>ลบงานนี้</button>
    <button data-x>ยกเลิก</button>`);
  const sh = bg.querySelector(".sheet");
  const send = async (data, btn, busy) => {
    const old = btn.textContent; btn.disabled = true; btn.textContent = busy;
    try { const j = await goalAct(data); if (!j) return; bg.remove(); toast(j.note); await reloadGarden(); if (DAYS) { DAYS = null; loadDays(); } }
    catch (_) { btn.disabled = false; btn.textContent = old; toast("ทำไม่สำเร็จ ลองอีกครั้งนะ"); }
  };
  sh.addEventListener("click", (e) => {
    const del = e.target.closest("[data-del]");
    if (del) {
      if (del.dataset.armed !== "1") { del.dataset.armed = "1"; del.textContent = "กดอีกครั้งเพื่อยืนยันลบ"; return; }
      return send(`a=task_del&t=${t.id}`, del, "กำลังลบ…");
    }
    const sv = e.target.closest("[data-save]"); if (!sv) return;
    const q = new URLSearchParams({ a: "task_edit", t: t.id });
    const title = sh.querySelector("[name=title]").value.trim(), due = sh.querySelector("[name=due]").value, rep = Number(sh.querySelector("[name=rep]").value);
    if (title && title !== t.title) q.set("title", title);
    if (due !== (t.due || "")) q.set("due", due || "none");
    if (rep !== (t.repeat || 0)) q.set("rep", rep);
    const note = sh.querySelector("[name=note]").value.trim(); if (note !== (t.note || "")) q.set("note", note);
    if ([...q.keys()].length <= 2) { bg.remove(); return; }
    send(q.toString(), sv, "กำลังบันทึก…");
  });
}
function editSheet(g, t) {
  const routine = t.status === "routine";
  const mOpts = [10, 15, 20, 30, 45, 60, 90, 120, 180];

    <p class="sh">ความยาก</p><div class="seg">${[["easy", "🪶 ง่าย"], ["medium", "ปานกลาง"], ["hard", "🧗 ยาก"]].map(([k, l]) => `<button data-ef="${k}" aria-pressed="${(t.effort ?? "medium") === k}">${l}</button>`).join("")}</div>

    <button class="primary" data-save>บันทึก</button>
    <button class="danger" data-del>ลบ${routine ? "กิจวัตร" : "งาน"}นี้</button>

  const sh = bg.querySelector(".sheet");
  const send = async (data, btn, busy) => {
    const old = btn.textContent; btn.disabled = true; btn.textContent = busy;

    catch (_) { btn.disabled = false; btn.textContent = old; toast("ทำไม่สำเร็จ ลองอีกครั้งนะ"); }
  };
  sh.addEventListener("click", (e) => {

    const del = e.target.closest("[data-del]");

      if (del.dataset.armed !== "1") { del.dataset.armed = "1"; del.textContent = "กดอีกครั้งเพื่อยืนยันลบ"; return; }

let ID_TOKEN = null, DAYS = null, DAY_I = null, BUSY = false;
// ID token ของ LINE หมดอายุใน 1 ชม. (เปิดค้างไว้ หรือเปิดในเบราว์เซอร์ข้างนอก) → ล็อกอินใหม่อัตโนมัติ 1 ครั้ง
function relogin() {
  let tried = false;
  try { tried = sessionStorage.getItem("kim_relogin") === "1"; sessionStorage.setItem("kim_relogin", "1"); } catch (_) {}
  if (tried) return false;

}
const DEMO = new URLSearchParams(location.search).has("demo");

function toast(msg) { if (!msg) return; const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

async function loadDays() {
  if (DEMO) { DAYS = demoDays(); return drawDays(); }
  try {
    const r = await fetch(`${FUNCTION_URL}?days=1`, { headers: { "x-line-id-token": ID_TOKEN } });
    if (r.status === 401 && relogin()) return;

}

// ติ๊ก/เลื่อนแล้วขึ้นทันที (ไม่รอเซิร์ฟเวอร์) แล้วค่อยโหลดแผนจริงมาเทียบเงียบๆ เมื่อคำขอทุกอันเสร็จ
let PENDING = 0;
function optimistic(data) {
  const q = new URLSearchParams(data), a = q.get("a"), d = DAYS?.days?.[DAY_I ?? 0];
  if (!d) return;
  const pid = Number(q.get("p"));
  if (a === "pdone") d.items.forEach((x) => { if (x.pid === pid) { x.result = "full"; x.started = null; } });
  else if (a === "pundo") d.items.forEach((x) => { if (x.pid === pid) x.result = null; });
  else if (a === "pmove") d.items = d.items.filter((x) => x.pid !== pid);
  else if (a === "ppart") d.items.forEach((x) => { if (x.pid === pid) { x.result = "partial"; x.done_min = Number(q.get("m")); } });
  else if (a === "pmin") d.items.forEach((x) => { if (x.pid === pid) x.done_min = Number(q.get("m")); });
  else if (a === "errand_done") d.errands = d.errands.filter((e) => String(e.id) !== q.get("t"));
  else if (a === "ext") d.ext = d.ext.filter((e) => e.id !== q.get("e"));
  else if (a === "energy") DAYS.energy = q.get("v");
  else if (a === "pstart") d.items.forEach((x) => { x.started = x.pid === pid ? new Date().toISOString() : null; });
  else if (a === "pstop") d.items.forEach((x) => { if (x.pid === pid) x.started = null; });
  else return;
  drawDays();
}
async function act(data) {
  const slow = /^a=(energy|replan|lighten|dayrest|fitday|porder)/.test(data);   // พวกนี้จัดแผนใหม่ทั้งวัน ต้องรอผล
  if (slow && BUSY) return;
  if (DEMO) { optimistic(data); toast("(ตัวอย่าง) " + data); return; }
  optimistic(data);
  PENDING++;
  if (slow) { BUSY = true; document.querySelectorAll("#dayview button").forEach((b) => (b.disabled = true)); }
  let failed = false;
  try {
    const r = await fetch(FUNCTION_URL, { method: "POST", headers: { "x-line-id-token": ID_TOKEN, "content-type": "application/json" }, body: JSON.stringify({ data }) });
    if (r.status === 401 && relogin()) return;
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.status);
    if (slow || !/^a=(pdone|pundo|pmin|task_edit)/.test(data)) toast(j.note);
    if (/^a=(dayrest|fitday|task_edit)/.test(data)) { OV = null; }
  } catch (e) { failed = true; toast("ทำไม่สำเร็จ ลองอีกครั้งนะ"); }
  finally {
    PENDING--;
    if (slow) { BUSY = false; }
    if (PENDING === 0 || failed) await loadDays();
  }
}

const badges = (x) => `${x.pri === 1 ? `<span class="badge pri">${L("สำคัญ", "Important")}</span>` : ""}${x.effort === "easy" ? `<span class="badge easy">${L("ง่าย", "Easy")}</span>` : x.effort === "hard" ? `<span class="badge hard">${L("ยาก", "Hard")}</span>` : ""}`;
let TICK = null;
function drawDays() {

  pick.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; DAY_I = Number(b.dataset.i); drawDays(); };
  const d = DAYS.days[DAY_I], rel = dayRel(d.day), today = rel === 0, past = rel < 0, tick = rel <= 0;
  const v = document.getElementById("dayview");
  const KEPTR = ["full", "small", "partial"];

  const row = (x) => {

      part ? `<span class="part">⏳ ทำไป ${fmtM(x.done_min) || "บางส่วน"} · ทำต่อวันถัดไป</span>` : "",

      escapeHtml(x.goal || ""), fmtM(x.minutes),
      x.fixed ? `📌 นัด ${x.fixed}` : x.due ? (x.due < DAYS.today && !done ? `<span class="warn">⏰ เลยกำหนด ${thDate(x.due)}</span>` : `⏰ ส่ง ${thDate(x.due)}`) : "",
      done && x.done_min ? `✓ ${fmtM(x.done_min)}` : "",
    ].filter(Boolean).join(" · ");
    const chk = !tick ? "" : (done || part) ? `<button class="tchk on${part ? " half" : ""}" data-act="a=pundo&p=${x.pid}" aria-label="เอาติ๊กออก">${part ? "½" : "✓"}</button>`

    const play = today && !x.result ? `<button class="tplay" data-act="a=${running ? "pstop" : "pstart"}&p=${x.pid}" aria-label="${running ? "หยุด" : "เริ่มทำ"}">${running ? "❚❚" : "▶"}</button>` : "";
    const more = tick && !x.result ? `<button class="tmore" data-row="${x.pid}" aria-label="ตัวเลือก">⋯</button>` : "";
    const ask = RECENT.has(x.pid) && done ? `<div class="tmin">ใช้เวลาจริงเท่าไหร่? ${[15, 30, 45, 60, 90, 120].map((m) => `<button data-act="a=pmin&p=${x.pid}&m=${m}" data-min="${x.pid}">${fmtM(m)}</button>`).join("")}<button data-min="${x.pid}" class="ok">ตามแผน</button></div>` : "";
    return `<div class="trow ${done ? "done" : part ? "partial" : none ? "none" : ""}${running ? " running" : ""}" style="--tc:${rowColor(x, type)}"><span class="ttime">${x.at || ""}</span>${chk}<div class="tbody"${x.tid ? ` data-row="${x.pid}"` : ""}><div class="ttitle"><span class="${chipCls()}" ${COLOR_BY === "type" ? "" : ""}>${GLABEL[type]}</span>${escapeHtml(x.title)}${badges(x)}</div><div class="tmeta">${meta}</div>${x.note ? `<div class="tnote">📝 ${escapeHtml(x.note)}</div>` : ""}${ask}</div>${play}${more}</div>`;

  const errRow = (e) => `<div class="trow" style="--tc:${COLOR_BY === "type" ? GCOLOR.errand : NEUTRAL}"><span class="ttime"></span><button class="tchk" data-act="a=errand_done&t=${e.id}&back=plan" aria-label="ทำเสร็จ"></button><div class="tbody editable" data-edit="${e.id}"><div class="ttitle"><span class="${chipCls()}">${GLABEL.errand}</span>${escapeHtml(e.title)}${e.note ? " 📝" : ""}</div><div class="tmeta">งานทั่วไป${e.repeat ? " · 🔁" : ""}${e.due && e.due < DAYS.today ? ` · <span class="warn">ค้างตั้งแต่ ${thDate(e.due)}</span>` : ""}</div></div><button class="tmore" data-edit="${e.id}">แก้</button></div>`;
  const extRow = (e) => `<div class="trow" style="--tc:${COLOR_BY === "type" ? (e.at ? GCOLOR.appt : GCOLOR.cal) : NEUTRAL}"><span class="ttime">${e.at || ""}</span><button class="tchk" data-act="a=ext&r=done&e=${encodeURIComponent(e.id)}" aria-label="ทำแล้ว"></button><div class="tbody"><div class="ttitle"><span class="${chipCls()}">${e.at ? GLABEL.appt : GLABEL.cal}</span>${escapeHtml(e.title)}</div><div class="tmeta">${escapeHtml(e.cal || "")}${e.at ? ` · ${fmtM(e.minutes)}` : " · ทั้งวัน"}</div></div><button class="tmore" data-act="a=ext&r=skip&e=${encodeURIComponent(e.id)}">ข้าม</button></div>`;
  // ไทม์ไลน์: มีเวลา (เรียงตามเวลา) → ทำเมื่อไหร่ก็ได้ (สำคัญก่อน) → เสร็จแล้ว (พับไว้)
  const open = d.items.filter((x) => !x.result), fin = d.items.filter((x) => x.result);
  const timed = [...open.filter((x) => x.at).map((x) => [toMinJs(x.at), row(x)]), ...(d.ext || []).filter((e) => e.at).map((e) => [toMinJs(e.at), extRow(e)])].sort((a, b) => a[0] - b[0]).map((x) => x[1]);
  const anyTime = [...open.filter((x) => !x.at).sort((a, b) => (b.started ? 1 : 0) - (a.started ? 1 : 0)).map(row), ...(d.ext || []).filter((e) => !e.at).map(extRow), ...(d.errands || []).map(errRow)];
  const add = today ? `<button class="gadd" data-adderr="1">+ งานทั่วไป</button>` : "";
  const en = DAYS.energy;
  const EHINT = { light: "เหลือแค่นัด งานสำคัญ/ใกล้ส่ง และกิจวัตรสั้นๆ ที่เหลือย้ายไปวันอื่น", normal: "แผนตามเวลาว่างปกติ (เผื่อไว้ราว 30%)", full: "ใช้เวลาว่างเต็มที่ และดึงงานวันข้างหน้ามาทำเพิ่ม" };
  const energyHtml = today ? `<div class="energy">พลังงานวันนี้ ${[["light", "🌿 เบาๆ"], ["normal", "🙂 ปกติ"], ["full", "⚡ เต็มที่"]].map(([k, l]) => `<button data-act="a=energy&v=${k}" aria-pressed="${en === k}">${l}</button>`).join("")}</div>${en ? `<p class="ehint">${EHINT[en]}</p>` : ""}` : "";
  const nt = today && DAYS.notice;
  const noticeHtml = nt ? `<div class="notice">${escapeHtml(nt.text).replace(/\n/g, "<br>")}${nt.act ? `<button data-act="${nt.act}">${escapeHtml(nt.label || "ตกลง")}</button>` : ""}</div>` : "";
  const canRest = rel >= 0;
  const restHtml = !canRest ? "" : d.restOv === "work" ? `<div class="restbar"><span>วันพักประจำ แต่${dayName(d.day)}ทำงานตามปกติ</span><button data-act="a=dayrest&d=${d.day}&v=auto">กลับมาพัก</button></div>`

    : d.restOv === "rest" ? `<div class="restbar"><span>🌙 ขอพัก${dayName(d.day)}แล้ว</span><button data-act="a=dayrest&d=${d.day}&v=auto">ยกเลิก ไม่พักแล้ว</button></div>` : "";
  const restLink = canRest && !d.restWd && !d.restOv ? ` · <button class="linkbtn" data-act="a=dayrest&d=${d.day}&v=rest">ขอพัก${dayName(d.day)}</button>` : "";
  const movable = open.filter((x) => !x.fixed && x.type !== "appt" && !x.started);
  const inToday = [...new Map(d.items.filter((x) => x.gid).map((x) => [x.gid, x.gname])).entries()].sort((a, b) => (DAYS.goals || []).findIndex((g) => g.id === a[0]) - (DAYS.goals || []).findIndex((g) => g.id === b[0]));
  const legend = COLOR_BY === "goal" && (inToday.length || (d.errands || []).length) ? `<div class="glegend">${inToday.map(([gid, n]) => `<span><i style="background:${goalColor(gid)}"></i>${escapeHtml(n || "")}</span>`).join("")}${(d.errands || []).length || (d.ext || []).length || d.items.some((x) => !x.gid) ? `<span><i style="background:${NEUTRAL}"></i>${L("ทั่วไป/นัด", "Errands/appts")}</span>` : ""}</div>` : "";
  const ordBtn = rel >= 0 && movable.length > 1 ? ` · <button class="linkbtn" data-reorder="1">↕ ${L("จัดลำดับ", "Reorder")}</button>` : "";

      ${list.map((pid, i) => { const x = byPid.get(pid); return `<div class="ord" style="--tc:${rowColor(x, x.type || "goal")}"><span class="ot">${i + 1}. ${escapeHtml(x.title)}<small>${escapeHtml(x.gname || x.goal || "")}${x.minutes ? ` · ${fmtM(x.minutes)}` : ""}</small></span><button data-up="${i}" ${i ? "" : "disabled"} aria-label="${L("ขึ้น", "Up")}">▲</button><button data-down="${i}" ${i < list.length - 1 ? "" : "disabled"} aria-label="${L("ลง", "Down")}">▼</button></div>`; }).join("")}
      <div class="ordbar"><button class="primary" data-ordsave="1">${L("บันทึกลำดับ", "Save order")}</button><button data-ordcancel="1">${L("ยกเลิก", "Cancel")}</button></div>`;

const clickDays = (d, today) => (e) => {
  if (e.target.closest("[data-reorder]")) { REORDER = true; return drawDays(); }
  const m = e.target.closest("[data-min]");
  if (m) { RECENT.delete(Number(m.dataset.min)); if (!m.dataset.act) return drawDays(); }
  const a = e.target.closest("[data-act]");
  if (a) { if (a.dataset.pid) RECENT.add(Number(a.dataset.pid)); return act(a.dataset.act); }
  const r = e.target.closest("[data-row]"); if (r) return rowSheet(d.items.find((x) => String(x.pid) === r.dataset.row), today && !d.items.find((x) => String(x.pid) === r.dataset.row)?.result);
};

// ⋯ ของแต่ละงาน: ทำไปบางส่วน · เลื่อน (เฉพาะวันนี้) · ความสำคัญ/ความยาก
function rowSheet(x, today) {
  if (!x) return;
  const tmr = DAYS.days.find((d) => dayRel(d.day) === 1)?.day, max = new Date(Date.parse(DAYS.today) + 90 * 864e5).toISOString().slice(0, 10);
  const canMove = today && !x.fixed;
  const isExt = String(x.title).startsWith("📅");
  const openRow = !x.result && dayRel(DAYS.days[DAY_I].day) <= 0;
  const bg = openSheet(`<h4>${escapeHtml(x.title)}</h4>
    ${x.tid && !isExt ? `<label class="fl">📝 ${L("โน้ต / รายละเอียด", "Notes / details")}<textarea name="tnote" rows="4" maxlength="4000" placeholder="${L("คำถามที่จะถาม ของที่ต้องเตรียม ลิงก์ ฯลฯ", "Questions, things to prepare, links…")}">${escapeHtml(x.note || "")}</textarea></label><button data-savenote="1">${L("บันทึกโน้ต", "Save note")}</button>` : ""}
    ${openRow ? `<p class="sh">⏳ ทำไปบางส่วนแล้ว ยังไม่เสร็จ</p><p>${x.routine ? "นับเป็นวันที่ได้ทำ" : "นับเป็นวันที่ได้ทำ คิมย้ายส่วนที่เหลือไปวันถัดไปให้"}</p>
    <div class="seg">${[15, 30, 45, 60, 90].map((m) => `<button data-part="${m}">${fmtM(m)}</button>`).join("")}</div>
    <label class="fl">หรือใส่เอง (นาที)<input type="text" inputmode="numeric" name="pm" placeholder="40"></label><button data-part="custom">บันทึกว่าทำไปบางส่วน</button>` : ""}
    ${canMove ? `<p class="sh">⏭ เลื่อน${x.due ? ` · กำหนดส่ง ${thDate(x.due)}` : ""}</p>
      ${x.routine ? `<button data-to="skip">ข้ามวันนี้ (รอบหน้าคิมจัดตามปกติ)</button>` : `<button data-to="1">พรุ่งนี้</button><button data-to="auto">ให้คิมหาวันว่าง</button>
      <label class="fl">เลือกวันเอง<input type="date" name="pick" min="${tmr}" max="${max}" value="${tmr}"></label><button data-to="pick">เลื่อนไปวันที่เลือก</button>`}` : ""}
    ${x.tid && !isExt ? `<p class="sh">ความสำคัญ</p><div class="seg">${[[1, "❗ สำคัญ"], [2, "ปกติ"], [3, "ว่างค่อยทำ"]].map(([k, l]) => `<button data-pr="${k}" aria-pressed="${(x.pri ?? 2) === k}">${l}</button>`).join("")}</div>
      <p class="sh">ความยาก</p><div class="seg">${[["easy", "🪶 ง่าย"], ["medium", "ปานกลาง"], ["hard", "🧗 ยาก"]].map(([k, l]) => `<button data-ef="${k}" aria-pressed="${(x.effort ?? "medium") === k}">${l}</button>`).join("")}</div>
      <p>คิมเดาให้ตอนจดงาน ปรับเองได้ · วันเบาๆ คิมเลือกงานง่ายและงานสำคัญก่อน</p>` : ""}
    <button data-x>ปิด</button>`);
  bg.querySelector(".sheet").addEventListener("click", (e) => {
    if (e.target.closest("[data-savenote]")) {
      const note = bg.querySelector("[name=tnote]").value.trim();
      x.note = note || null; bg.remove(); drawDays();
      return act(`a=task_edit&t=${x.tid}&note=${encodeURIComponent(note)}`);
    }
    const p = e.target.closest("[data-part]");
    if (p) {
      const m = p.dataset.part === "custom" ? Number(bg.querySelector("[name=pm]").value) : Number(p.dataset.part);

      bg.remove(); return act(`a=ppart&p=${x.pid}&m=${Math.round(m)}`);
    }
    const pr = e.target.closest("[data-pr]"), ef = e.target.closest("[data-ef]");
    if (pr || ef) {
      const b = pr || ef;
      b.parentElement.querySelectorAll("button").forEach((o) => o.setAttribute("aria-pressed", o === b));

  });
}

// เพิ่มงานทั่วไปจากหน้าแอป (ปุ่ม + เพิ่ม ในแท็บวันนี้และแท็บเป้าหมาย)
function errandAddSheet() {
  const reps = [[0, "ไม่ซ้ำ"], [7, "ทุกสัปดาห์"], [14, "ทุก 2 สัปดาห์"], [30, "ทุกเดือน"], [90, "ทุก 3 เดือน"], [365, "ทุกปี"]];
  const today = DAYS?.today || GDATA?.today || "";

// ===== แท็บภาพรวม: สถิติรายปี + ปฏิทิน 3 เดือนข้างหน้า (แทนสวน/ต่อเนื่อง) =====
let OV = null, OV_YEAR = null, CAL_M = 0, CAL_SEL = null;
async function loadOverview(y) {
  const box = document.getElementById("ov");
  if (DEMO) { OV = demoOverview(); return drawOverview(); }
  box.innerHTML = '<p class="note">กำลังโหลด…</p>';
  try {
    const r = await fetch(`${FUNCTION_URL}?overview=1&y=${y || ""}`, { headers: { "x-line-id-token": ID_TOKEN } });
    if (r.status === 401 && relogin()) return;
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    OV = j; OV_YEAR = j.year; drawOverview();
  } catch (e) { box.innerHTML = `<p class="hint">โหลดภาพรวมไม่สำเร็จ (${escapeHtml(String(e.message || e))}) · ตรวจว่า deploy garden-data และ line-webhook ตัวล่าสุดแล้ว</p>`; }
}
const hrs = (m) => (m / 60).toFixed(m >= 600 ? 0 : 1);
function drawOverview() {
  const o = OV, box = document.getElementById("ov");
  const s = o.stats;
  const maxM = Math.max(1, ...o.months.map((m) => m.min));
  // แท่งรายเดือน (ชั่วโมงที่ทำ) · ชุดเดียว ไม่ต้องมีคำอธิบายสี
  const W = 360, H = 150, bw = 22, gap = (W - 24 - 12 * bw) / 11;
  const bars = o.months.map((m, i) => {
    const h = Math.round((m.min / maxM) * 100), x = 12 + i * (bw + gap), y = 118 - h;
    return `<g><title>${MONTH[i]}: ${hrs(m.min)} ${L("ชม.", "h")} · ${m.done} ${L("งาน", "tasks")}</title><rect x="${x - gap / 2}" y="0" width="${bw + gap}" height="140" fill="transparent"/>${m.min ? `<path d="M${x},118 v${-(h - 4)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 v${h - 4} z" fill="${C("--leaf")}"/>` : ""}<text x="${x + bw / 2}" y="134" text-anchor="middle" font-size="10" fill="${C("--muted")}">${MONTH[i].replace(".", "").slice(0, 3)}</text></g>`;
  }).join("");
  const peak = o.months.reduce((a, b) => (b.min > a.min ? b : a), o.months[0]);
  // ฮีตแมปทั้งปี (โทนเขียวเดียว อ่อน → เข้ม ตามนาที)
  const y0 = `${o.year}-01-01`, start = new Date(y0 + "T00:00:00Z"); start.setUTCDate(start.getUTCDate() - start.getUTCDay());
  const cs = 6, cg = 1;
  let cells = "";
  for (let w = 0; w < 53; w++) for (let r = 0; r < 7; r++) {
    const d = new Date(start); d.setUTCDate(start.getUTCDate() + w * 7 + r);
    const k = d.toISOString().slice(0, 10);
    if (k.slice(0, 4) !== String(o.year) || k > o.today) continue;
    const m = o.heat[k] || 0;
    const fill = !m ? C("--empty") : m >= 60 ? "#1f6e47" : m >= 30 ? C("--leaf") : m >= 15 ? C("--leaf-2") : C("--leaf-3");
    cells += `<rect x="${w * (cs + cg)}" y="${r * (cs + cg)}" width="${cs}" height="${cs}" rx="1.5" fill="${fill}"><title>${k}${m ? ` · ${fmtM(m) || m + " min"}` : ""}</title></rect>`;
  }
  const maxG = Math.max(1, ...o.goals.map((g) => g.min));
  // ดีกว่าเมื่อวาน: เทียบกับตัวเองปีก่อนช่วงเดียวกัน (ไม่เทียบกับใคร)
  const vs = (now, before, fmt = (x) => x) => o.prev ? `<em class="vs">${L("ปีก่อนช่วงเดียวกัน", "Same period last year")} ${fmt(before)}${now > before ? " ↑" : ""}</em>` : "";
  const curM = o.year === Number(o.today.slice(0, 4)) ? Number(o.today.slice(5, 7)) : 0;
  const mNow = curM ? o.months[curM - 1] : null, mPrev = curM > 1 ? o.months[curM - 2] : null;
  box.innerHTML = `
    <div class="ov-top"><b>${L("ภาพรวมปี", "Year")} ${LANG === "en" ? o.year : o.year + 543}</b>
      <select id="ov-year" aria-label="${L("เลือกปี", "Year")}">${o.years.slice().reverse().map((y) => `<option value="${y}" ${y === o.year ? "selected" : ""}>${LANG === "en" ? y : y + 543}</option>`).join("")}</select></div>
    <div class="kpis">
      <div class="kpi"><b>${s.days}</b><span>${L("วันที่ได้ทำ", "days you showed up")}</span>${vs(s.days, o.prev?.days)}</div>
      <div class="kpi"><b>${hrs(s.minutes)}</b><span>${L("ชั่วโมงที่ลงมือ", "hours of work")}</span>${vs(s.minutes, o.prev?.minutes, hrs)}</div>
      <div class="kpi"><b>${s.done}</b><span>${L("งานที่ทำแล้ว", "tasks done")}</span>${vs(s.done, o.prev?.done)}</div>
      <div class="kpi"><b>${s.planned ? s.rate + "%" : "–"}</b><span>${L("ทำตามแผน", "plan kept")}</span></div>
    </div>
    <p class="ov-h">${L("ชั่วโมงรายเดือน", "Hours per month")}</p>
    <svg viewBox="0 0 ${W} 140" role="img" aria-label="${L("ชั่วโมงรายเดือน", "Hours per month")}"><line x1="8" y1="118.5" x2="352" y2="118.5" stroke="${C("--line")}"/>${bars}</svg>
    ${mNow && mPrev && (mNow.min || mPrev.min) ? `<p class="note">${L(`เดือนนี้ ${hrs(mNow.min)} ชม. · เดือนก่อน ${hrs(mPrev.min)} ชม.${mNow.min > mPrev.min ? " · ดีกว่าตัวเองเดือนก่อนแล้ว ✨" : ""}`, `This month ${hrs(mNow.min)} h · last month ${hrs(mPrev.min)} h${mNow.min > mPrev.min ? " · already ahead of last month ✨" : ""}`)}</p>` : ""}
    ${peak.min ? `<p class="note">${L(`เดือนที่ทำเยอะสุด: ${MONTH[peak.m - 1]} ${hrs(peak.min)} ชม.`, `Busiest month: ${MONTH[peak.m - 1]}, ${hrs(peak.min)} h`)}</p>` : ""}
    <p class="ov-h">${L("เวลาต่อเป้า", "Time per goal")}</p>
    ${o.goals.length ? o.goals.map((g) => `<div class="hbar"><span class="nm">${escapeHtml(g.goal)}</span><span class="tr"><i style="width:${Math.max(3, Math.round((g.min / maxG) * 100))}%"></i></span><span class="v">${hrs(g.min)} ${L("ชม.", "h")}</span></div>`).join("") : `<p class="hint">${L("ยังไม่มีข้อมูลปีนี้", "No data this year yet")}</p>`}

    ]);
    if (res.status === 401 && relogin()) return;
    if (res.status === 401) return showState("ล็อกอิน LINE หมดอายุ ปิดหน้านี้แล้วเปิดใหม่จากปุ่ม \"📋 เปิดในแอป\" ในแชทคิมนะ");
    try { sessionStorage.removeItem("kim_relogin"); } catch (_) {}
    if (res.status === 404) return showState("ยังไม่ได้เริ่มกับคิมเลย กลับไปที่แชทแล้วตั้งเป้าแรกก่อนนะ 🌱");
    if (!res.ok) return showState(`เปิดสวนไม่สำเร็จ (ข้อมูลตอบกลับ ${res.status}: ${(await res.text()).slice(0, 120)})`);
    NAME = profile?.displayName ?? "";
    const gd = await res.json();
    if ((gd.lang || "th") !== LANG) { LANG = gd.lang === "en" ? "en" : "th"; try { localStorage.setItem("kim_lang", LANG); } catch (_) {} applyLangArrays(); }
    render(gd, NAME);
    const want = new URLSearchParams(location.search).get("tab") || (new URLSearchParams(location.search).get("liff.state") || "").match(/tab=(\w+)/)?.[1];
    openTab(["today", "goals", "streak", "notes", "garden", "overview"].includes(want) ? want : "today");
  } catch (e) {
    const msg = e?.message || String(e);
    const hint = /liff|LIFF/.test(msg) ? "ตรวจ LIFF ID" : /fetch|network|Load failed/i.test(msg) ? "เรียก Supabase ไม่ได้: ตรวจว่าปิด JWT ของ garden-data แล้ว" : "";
    showState(`เปิดสวนไม่สำเร็จ: ${msg}${hint ? ` (${hint})` : ""}`);
    console.error(e);
  }
})();
</script>
</body>
</html>
